<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Alisa fx</title>
  
  <meta name="description" content="Admin ">
  <meta name="theme-color" content="#070410">
  <meta property="og:image" content="https://firstmodelhub.com/images/adminkissmodelsocial.webp">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="shortcut icon" href="/images/favicon.ico">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: 'Sarabun', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  
  :root {
    --color-primary: 90 44 190;
    --color-text-main: #2E2E2E;
    --color-text-muted: #5a5a6a;
    --color-card: rgba(255, 255, 255, 0.85);
    --color-border: #E6E0FF;
    --grad-1: #5A2CBE;
    --grad-2: #C084FC;
    --color-highlight: #FFEB3B;
  }
  :root[data-theme="dark"] {
    --color-text-main: #F7F5FF;
    --color-text-muted: #a8a0b5;
    --color-card: rgba(13, 8, 30, 0.85);
    --color-border: #2D1B4E;
    --grad-1: #9333EA;
    --grad-2: #C084FC;
  }

  @keyframes animated-aurora {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  body {
    color: var(--color-text-main);
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(-45deg, #090514, #120924, #1A0D36, #000000);
    background-size: 400% 400%;
    animation: animated-aurora 20s ease infinite;
  }
  :root[data-theme="dark"] body {
    background: linear-gradient(-45deg, #05030A, #0F091F, #1F0E3D, #000000);
    background-size: 400% 400%;
    animation: animated-aurora 20s ease infinite;
  }
  
  .kissmodel-logo {
    font-size: 1.5rem; font-weight: 800; display: inline-block; color: #fff;
    text-shadow: 0 0 5px var(--grad-1), 0 0 10px var(--grad-1), 0 0 20px var(--grad-2);
  }
  .kissmodel-logo .star {
    font-size: 1.2em; display: inline-block; color: var(--color-highlight);
    animation: star-glow 2s infinite ease-in-out;
  }
  @keyframes star-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3) rotate(15deg); } }

  .btn-pro {
    position: relative; overflow: hidden; border-radius: 9999px;
    padding: .7rem 1.2rem; font-weight: 600; color: #fff !important;
    background: linear-gradient(90deg, var(--grad-1), var(--grad-2));
    box-shadow: 0 10px 24px rgba(var(--color-primary), 0.35);
    transition: transform .15s ease, filter .2s ease;
    border: none;
    cursor: pointer;
  }
  .btn-pro:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .btn-pro:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .card-surface {
    background-color: var(--color-card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 1.25rem;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .form-input-high {
    width: 100%;
    padding: 0.75rem 1.2rem;
    border: 1px solid var(--color-border);
    border-radius: 0.75rem;
    background-color: rgba(255, 255, 255, 0.9) !important;
    color: #121214 !important;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    outline: none;
  }
  
  :root[data-theme="dark"] .form-input-high {
    background-color: rgba(14, 9, 30, 0.85) !important;
    color: #FFFFFF !important;
    border-color: rgba(147, 51, 234, 0.25);
  }
</style>
</head>
<body>
  <div id="app-wrapper">
    <div id="toast-container" style="position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 10001;"></div>

    <div class="min-h-screen flex items-center justify-center p-4" id="login-container">
      <div class="max-w-md w-full p-8 card-surface">
        <div class="text-center mb-8">
          <div class="kissmodel-logo inline-block mb-2">First<span class="star">🌟</span></div>
          <p class="mt-1 text-sm font-medium" style="color: var(--color-text-muted)">Administrator Access</p>
        </div>
        <form class="space-y-5" id="loginForm">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-zinc-400" for="email">อีเมล</label>
            <input class="form-input-high mt-1" id="email" name="email" placeholder="admin@example.com" required type="email" value=""/>
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-zinc-400" for="password">รหัสผ่าน</label>
            <input class="form-input-high mt-1" id="password" name="password" placeholder="Password" required type="password" value=""/>
          </div>
          <div>
            <button class="w-full flex justify-center items-center py-3 px-4 btn-pro mt-2 font-bold" id="login-submit-btn" type="submit">
              เข้าสู่ระบบ
            </button>
          </div>
          <p class="text-center text-sm font-medium min-h-[20px]" id="login-error" style="color: #ef4444;"></p>
        </form>
      </div>
    </div>
  </div>

<script>
  function showToast(message) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'flex items-center gap-3 p-4 rounded-lg text-white shadow-lg transform transition-all duration-300 translate-x-full bg-red-600 mb-2';
    toast.innerHTML = `<i class="fas fa-exclamation-triangle text-xl"></i><span>${message}</span>`;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
    setTimeout(() => {
      toast.classList.add('translate-x-full');
      toast.addEventListener('transitionend', () => toast.remove());
    }, 3000);
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-submit-btn');
    const errorEl = document.getElementById('login-error');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner animate-spin mr-2"></i> กำลังเข้าสู่ระบบ...';
    errorEl.textContent = '';

    setTimeout(() => {
      // เปลี่ยนข้อความแจ้งเตือนตรงนี้ได้ตามต้องการ เช่น "อีเมลหรือรหัสผ่านไม่ถูกต้อง"
      errorEl.textContent = 'ไม่สามารถเข้าสู่ระบบได้: ระบบถูกปิดการใช้งานชั่วคราว';
      showToast('ล็อกอินล้มเหลว');
      btn.disabled = false;
      btn.innerHTML = 'เข้าสู่ระบบ';
    }, 600);
  });
</script>
</body>
</html>
